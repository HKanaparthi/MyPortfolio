function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clamp = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, offsetRef.current.x), window.innerWidth - w - PAD),
      y: Math.min(Math.max(PAD, offsetRef.current.y), window.innerHeight - h - PAD),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    const onMsg = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = e => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const move = ev => { offsetRef.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; clamp(); };
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, children }) {
  return <><div className="twk-sect">{title}</div>{children}</>;
}

function TweakRadio({ id, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const n = opts.length;
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const valueRef = React.useRef(value); valueRef.current = value;
  const segAt = cx => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((cx - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n-1, i))].value;
  };
  const onPointerDown = e => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valueRef.current) onChange(v0);
    const move = ev => { const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
         className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
      <div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx}*(100% - 4px)/${n})`, width:`calc((100% - 4px)/${n})` }} />
      {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value===value}>{o.label}</button>)}
    </div>
  );
}

function TweakToggle({ id, label, value, onChange }) {

function useTypewriter(words, speed = 80, pause = 1800) {
  const [display, setDisplay] = useState("");
  const [wordIdx, setWordIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);
  useEffect(() => {
    const word = words[wordIdx % words.length];
    const delay = deleting ? speed / 2 : charIdx === word.length ? pause : speed;
    const t = setTimeout(() => {
      if (!deleting && charIdx < word.length) {
        setDisplay(word.slice(0, charIdx + 1));
        setCharIdx(c => c + 1);
      } else if (!deleting && charIdx === word.length) {
        setDeleting(true);
      } else if (deleting && charIdx > 0) {
        setDisplay(word.slice(0, charIdx - 1));
        setCharIdx(c => c - 1);
      } else {
        setDeleting(false);
        setWordIdx(i => (i + 1) % words.length);
      }
    }, delay);
    return () => clearTimeout(t);
  }, [charIdx, deleting, wordIdx, words, speed, pause]);
  return display;
}

function useScrollReveal() {
  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); }),
      { threshold: 0.12 }
    );
    document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

function SkillBar({ name, level, accent, version }) {
  const [animated, setAnimated] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver(([e]) => { if (e.isIntersecting) setAnimated(true); }, { threshold: 0.3 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ marginBottom: "14px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "6px" }}>
        <span style={{ fontSize: "13px", color: "#a8c8e0", fontWeight: 500 }}>{name}</span>
        <span style={{ fontSize: "12px", color: "#3a5570" }}>{level}%</span>
      </div>
      <div style={{
        height: version === "safe" ? "4px" : "2px",
        background: "rgba(116,185,231,0.08)",
        borderRadius: "2px",
        overflow: "hidden",
      }}>
        <div style={{
          height: "100%",
          width: animated ? `${level}%` : "0%",
          background: accent,
          transition: "width 1.2s cubic-bezier(.22,1,.36,1)",
          borderRadius: "2px",
        }} />
      </div>
    </div>
  );
}

                        padding: "4px 10px",
                        borderRadius: isSafe ? "4px" : "2px",
                        letterSpacing: "0.04em",
                      }}>{t}</span>
                    ))}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function ProjectCard({ project, version, accent, idx }) {
  const isSafe = version === "safe";
  return (
    <div className={`reveal reveal-delay-${(idx % 3) + 1}`} style={{
      background: "rgba(116,185,231,0.03)",
      border: `1px solid ${project.highlight ? `${accent}35` : "rgba(116,185,231,0.06)"}`,
      borderRadius: isSafe ? "14px" : "4px",
      padding: "28px",
      display: "flex",
      flexDirection: "column",
      gap: "14px",
      position: "relative",
      overflow: "hidden",
      transition: "transform 0.3s cubic-bezier(.22,1,.36,1), border-color 0.2s, box-shadow 0.3s",
    }}
    onMouseEnter={e => {
      e.currentTarget.style.transform = "translateY(-4px)";
      e.currentTarget.style.borderColor = accent;
      e.currentTarget.style.boxShadow = `0 12px 40px ${accent}20`;
    }}
    onMouseLeave={e => {
      e.currentTarget.style.transform = "";
      e.currentTarget.style.borderColor = project.highlight ? `${accent}35` : "rgba(116,185,231,0.06)";
      e.currentTarget.style.boxShadow = "";
    }}
    >
      {project.highlight && (
        <div style={{
          position: "absolute", top: "16px", right: "16px",
          background: accent,
          color: "#fff",
          fontSize: "10px", fontWeight: 700,
          padding: "3px 8px",
          borderRadius: isSafe ? "4px" : "2px",
          letterSpacing: "0.08em",
        }}>FEATURED</div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{
          width: "40px", height: "40px",
          background: `${accent}15`,
          borderRadius: isSafe ? "10px" : "4px",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: "18px",
        }}>
          {["📡","🔐","🌳","🌤️","📋"][idx] || "⚙️"}
        </div>
        <span style={{ fontSize: "12px", color: "#3a5570" }}>{project.year}</span>
      </div>
      <h3 style={{
        fontFamily: isSafe ? "'Playfair Display', serif" : "'Syne', sans-serif",
        fontSize: isSafe ? "17px" : "16px",
        fontWeight: isSafe ? 700 : 800,
        color: "#ddeaf6",
        lineHeight: 1.3,
      }}>{project.title}</h3>
      <p style={{ fontSize: "13px", color: "#6a8aa0", lineHeight: 1.7, flex: 1 }}>{project.desc}</p>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "6px" }}>
        {project.tags.map(t => (
          <span key={t} style={{
            fontSize: "11px", color: accent,
            background: `${accent}12`,
            padding: "3px 8px",
            borderRadius: isSafe ? "4px" : "2px",
            fontWeight: 600,
          }}>{t}</span>
        ))}
      </div>
      <div style={{ display: "flex", gap: "12px", marginTop: "4px" }}>
        {project.github && (
          <a href={project.github} target="_blank" rel="noreferrer" style={{
            fontSize: "12px", fontWeight: 600,
            color: "#8da8bf", textDecoration: "none",
            transition: "color 0.2s",
          }}
          onMouseEnter={e => e.target.style.color = accent}
          onMouseLeave={e => e.target.style.color = "#8da8bf"}
          >GitHub →</a>
        )}
        {project.demo && (
          <a href={project.demo} target="_blank" rel="noreferrer" style={{
            fontSize: "12px", fontWeight: 600,
            color: "#8da8bf", textDecoration: "none",
            transition: "color 0.2s",
          }}
          onMouseEnter={e => e.target.style.color = accent}
          onMouseLeave={e => e.target.style.color = "#8da8bf"}
          >Live Demo →</a>
        )}
      </div>
    </div>
  );
}

function ProjectsSection({ version, accent }) {
  return (
    <section id="projects" style={{ padding: "100px 40px", maxWidth: "1200px", margin: "0 auto" }}>
      <SectionHeader label="Work" title="Featured Projects" version={version} accent={accent} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: "24px" }}>
        {DATA.projects.map((p, i) => (
          <ProjectCard key={p.title} project={p} version={version} accent={accent} idx={i} />
        ))}
      </div>
    </section>
  );
}

    }}>
      <div style={{ maxWidth: "1200px", margin: "0 auto" }}>
        <SectionHeader label="Research" title="Publications" version={version} accent={accent} />

            >
              <div style={{

                background: `${accent}15`,

                borderRadius: isSafe ? "8px" : "2px",

              }}>{pub.year}</div>
              <div>
                <h3 style={{
                  fontFamily: isSafe ? "'Playfair Display', serif" : "'Syne', sans-serif",

                  fontWeight: isSafe ? 700 : 700,
                  color: "#ddeaf6",

          <h3 style={{

            fontSize: "22px", fontWeight: isSafe ? 700 : 800,
            color: "#ddeaf6", marginBottom: "24px",
          }}>Certifications</h3>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: "16px" }}>
            {DATA.certifications.map((cert, i) => (
              <div key={i} style={{
                background: "rgba(116,185,231,0.04)",
                border: "1px solid rgba(116,185,231,0.08)",
                borderRadius: isSafe ? "10px" : "4px",
                padding: "18px 20px",
                transition: "border-color 0.2s",
              }}
              onMouseEnter={e => e.currentTarget.style.borderColor = accent}
              onMouseLeave={e => e.currentTarget.style.borderColor = "rgba(116,185,231,0.08)"}
              >
                <p style={{ fontSize: "13px", fontWeight: 600, color: "#a8c8e0", marginBottom: "4px" }}>{cert.name}</p>
                <p style={{ fontSize: "11px", color: accent, fontWeight: 600 }}>{cert.issuer}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function ContactSection({ version, accent }) {
  const isSafe = version === "safe";
  return (
    <section id="contact" style={{ padding: "100px 40px", maxWidth: "900px", margin: "0 auto", textAlign: "center" }}>
      <div className="reveal">
        <p style={{
          color: accent, fontSize: "12px", fontWeight: 700,
          letterSpacing: "0.2em", textTransform: "uppercase",
          marginBottom: "16px",
          fontFamily: isSafe ? "inherit" : "'Space Grotesk', sans-serif",

          color: "#ddeaf6",
          letterSpacing: isSafe ? "0" : "-0.02em",

          {isSafe ? "Let's Work Together" : "LET'S CONNECT"}
        </h2>
        <p style={{ fontSize: "16px", color: "#5c7a90", lineHeight: 1.8, marginBottom: "48px", maxWidth: "500px", margin: "0 auto 48px" }}>

        </p>
        <div style={{ display: "flex", gap: "16px", justifyContent: "center", flexWrap: "wrap" }}>

          <a href={DATA.linkedin} target="_blank" rel="noreferrer" style={{

          <a href={DATA.github} target="_blank" rel="noreferrer" style={{
            border: "1px solid rgba(255,255,255,0.12)",

}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const version = tweaks.version;
  const accent = tweaks.accentColor;
  const showPhoto = tweaks.showPhoto;
  const compact = tweaks.compactNav;

  useScrollReveal();

  useEffect(() => {
    document.body.className = version === "bold" ? "bold" : "";
  }, [version]);

  return (
    <>
      <NavBar version={version} accent={accent} compact={compact} />

      {version === "safe"
        ? <HeroSafe accent={accent} showPhoto={showPhoto} />
        : <HeroBold accent={accent} showPhoto={showPhoto} />
      }

      {/* About strip */}
      <div id="about" style={{
        borderTop: "1px solid rgba(116,185,231,0.05)",
        borderBottom: "1px solid rgba(116,185,231,0.05)",
        background: "rgba(116,185,231,0.025)",
        padding: "60px 40px",
      }}>
        <div style={{
          maxWidth: "1200px", margin: "0 auto",
          display: "flex", gap: "60px", alignItems: "center",
        }}>
          {showPhoto && (
            <div className="reveal" style={{ flex: "0 0 180px" }}>
              <img
                src="https://hkanaparthi.github.io/MyPortfolio/Secondpic.jpeg"
                alt="Harsha"
                style={{
                  width: "180px", height: "180px",
                  borderRadius: version === "safe" ? "50%" : "4px",
                  objectFit: "cover",
                  border: `2px solid ${accent}40`,
                }}
                onError={e => e.target.style.display = "none"}
              />
            </div>
          )}
          <div className="reveal reveal-delay-1" style={{ flex: 1 }}>
            <p style={{
              color: accent, fontSize: "11px", fontWeight: 700,
              letterSpacing: "0.2em", textTransform: "uppercase",
              marginBottom: "12px",
            }}>Who I Am</p>
            <p style={{
              fontFamily: version === "safe" ? "'Playfair Display', serif" : "'Syne', sans-serif",
              fontSize: "clamp(20px, 2.5vw, 28px)",
              fontWeight: version === "safe" ? 700 : 700,
              color: "#ddeaf6",
              lineHeight: 1.5,
              marginBottom: "16px",
            }}>
              M.S. Computer Science at UNC Charlotte (GPA 4.0) with 2.5+ years shipping <span style={{ color: accent }}>distributed systems</span>, full-stack apps, and AI-powered products to production.
            </p>
            <p style={{ fontSize: "15px", color: "#5c7a90", lineHeight: 1.8 }}>
              I've built event pipelines at 10K+ events/sec, production ML at 99%+ accuracy, and cloud-native services at 99.5% uptime. IEEE-published researcher. Open to new grad SWE roles — on OPT, no sponsorship required.
            </p>
          </div>
        </div>
      </div>

      <ProjectsSection version={version} accent={accent} />
      <ExperienceSection version={version} accent={accent} />
      <SkillsSection version={version} accent={accent} />
      <PublicationsSection version={version} accent={accent} />
      <ContactSection version={version} accent={accent} />
      <Footer version={version} accent={accent} />

      <TweaksPanel>
        <TweakSection title="Design Version">
          <TweakRadio
            id="version"
            value={tweaks.version}
            options={[
              { value: "safe", label: "Safe" },
              { value: "bold", label: "Bold" },
            ]}
            onChange={v => setTweak("version", v)}
          />
        </TweakSection>
        <TweakSection title="Accent Color">
          <TweakColor
            id="accentColor"
            value={tweaks.accentColor}
            onChange={v => setTweak("accentColor", v)}
          />
        </TweakSection>
        <TweakSection title="Display Options">
          <TweakToggle
            id="showPhoto"
            label="Show Profile Photo"
            value={tweaks.showPhoto}
            onChange={v => setTweak("showPhoto", v)}
          />
          <TweakToggle
            id="compactNav"
            label="Compact Navbar"
            value={tweaks.compactNav}
            onChange={v => setTweak("compactNav", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
